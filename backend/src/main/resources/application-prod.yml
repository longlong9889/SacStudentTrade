server:
  port: ${PORT:8080}
  error:
    include-message: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"

aws:
  region: ${AWS_REGION:us-west-1}
  s3:
    buckets:
      customer: ${S3_BUCKET:fs-bucket-customer-test}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 60000
      max-lifetime: 120000
      keepalive-time: 30000
      idle-timeout: 60000
      validation-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  main:
    web-application-type: servlet
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  codec:
    max-in-memory-size: 10MB